<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Services | The Organised Types</title>
<meta name="description" content="Planners, business tools, branding kits and TOTS-OS plans — everything The Organised Types offers, in one place." />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="header.css">
<style>
	:root{
		--bg:#F8F7F4;
		--bg-raised:#FFFFFF;
		--sage:#B7C6AE;
		--sage-soft:#DCE3D6;
		--sage-deep:#8FA184;
		--green:#4D5B4B;
		--green-deep:#374235;
		--text:#2D302C;
		--text-soft:#6B6F67;
		--gold:#C7A467;
		--line:rgba(45,48,44,0.08);
		--shadow-soft: 0 20px 60px -20px rgba(45,48,44,0.18);
		--shadow-card: 0 10px 30px -10px rgba(45,48,44,0.12);
		--radius-lg: 28px;
		--radius-md: 18px;
		--radius-sm: 12px;
		--ease: cubic-bezier(.16,.84,.44,1);
	}
	*{margin:0;padding:0;box-sizing:border-box;}
	html{scroll-behavior:smooth;}
	body{background:var(--bg); color:var(--text); font-family:'Poppins',sans-serif; overflow-x:hidden; -webkit-font-smoothing:antialiased;}
	h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.02em; line-height:1.02; font-weight:600;}
	a{text-decoration:none; color:inherit;}
	img{display:block; max-width:100%;}
	section{position:relative;}
	.wrap{max-width:1280px; margin:0 auto; padding:0 48px;}
	::selection{background:var(--sage); color:var(--green-deep);}
	@media (prefers-reduced-motion: reduce){
		*{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
	}

	/* ---------- reveal ---------- */
	.reveal{opacity:0; transform:translateY(30px) scale(0.99); transition:opacity 0.9s var(--ease), transform 0.9s var(--ease);}
	.reveal.in{opacity:1; transform:translateY(0) scale(1);}
	.reveal-delay-1{transition-delay:0.06s;}
	.reveal-delay-2{transition-delay:0.12s;}
	.reveal-delay-3{transition-delay:0.18s;}
	.reveal-delay-4{transition-delay:0.24s;}

	/* ---------- signature flowing thread ---------- */
	.journey-thread{position:fixed; left:40px; top:0; height:100vh; width:2px; z-index:40; pointer-events:none; display:flex; align-items:center;}
	.journey-track{
		position:relative; width:2px; height:280px;
		background:linear-gradient(to bottom, transparent, var(--sage) 12%, var(--green) 50%, var(--sage) 88%, transparent);
		background-size:100% 240%; opacity:0.5; animation:flowLine 7s linear infinite;
	}
	@keyframes flowLine{ 0%{background-position:0 0;} 100%{background-position:0 240%;} }
	.journey-dot{
		position:absolute; left:50%; top:0; width:9px; height:9px; border-radius:50%;
		background:var(--green); transform:translate(-50%,-50%); box-shadow:0 0 0 5px rgba(77,91,75,0.12);
		transition:top 0.15s linear;
	}
	@media (max-width:1100px){ .journey-thread{display:none;} }


	.btn{
		display:inline-flex; align-items:center; justify-content:center; gap:8px;
		font-family:'Poppins',sans-serif; font-weight:600; font-size:14.5px; padding:13px 26px;
		border-radius:100px; cursor:pointer; border:1px solid transparent;
		transition:transform 0.35s var(--ease), box-shadow 0.35s var(--ease), background 0.35s var(--ease), border-color 0.35s var(--ease);
		white-space:nowrap;
	}
	.btn-primary{background:var(--green); color:#F8F7F4; box-shadow:0 10px 24px -10px rgba(77,91,75,0.55);}
	.btn-primary:hover{transform:translateY(-3px) scale(1.025); box-shadow:0 18px 36px -12px rgba(77,91,75,0.65), 0 0 0 6px rgba(183,198,174,0.22);}
	.btn-ghost{background:rgba(255,255,255,0.55); border:1px solid var(--line); color:var(--text); backdrop-filter:blur(6px);}
	.btn-ghost:hover{transform:translateY(-3px) scale(1.025); background:rgba(255,255,255,0.85); border-color:rgba(45,48,44,0.16);}
	.btn-sm{padding:10px 20px; font-size:13.5px;}

	/* ---------- hero ---------- */
	.hero-banner{
		min-height:66vh; display:flex; align-items:flex-end;
		padding:220px 0 90px; overflow:hidden;
	}
	.hero-banner-inner{max-width:1280px; margin:0 auto; padding:0 48px; width:100%; position:relative; z-index:2;}
	.blob{position:absolute; border-radius:50%; filter:blur(70px); opacity:0.5; z-index:0; animation:drift 18s ease-in-out infinite;}
	.blob-1{width:520px; height:520px; background:radial-gradient(circle at 30% 30%, var(--sage) 0%, transparent 70%); top:-120px; right:-40px;}
	.blob-2{width:380px; height:380px; background:radial-gradient(circle at 60% 40%, var(--gold) 0%, transparent 70%); opacity:0.2; top:40px; left:-100px; animation-delay:-6s;}
	@keyframes drift{
		0%,100%{transform:translate(0,0) scale(1);}
		33%{transform:translate(30px,-30px) scale(1.06);}
		66%{transform:translate(-20px,20px) scale(0.96);}
	}
	.eyebrow{
		display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600;
		letter-spacing:0.06em; text-transform:uppercase; color:var(--green-deep);
		background:rgba(183,198,174,0.35); border:1px solid rgba(77,91,75,0.15);
		padding:8px 16px; border-radius:100px; margin-bottom:26px;
	}
	.eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(77,91,75,0.18);}
	.hero-banner h1{font-size:clamp(48px, 6.5vw, 94px); color:var(--text); max-width:820px;}
	.hero-banner p{margin-top:22px; font-size:18px; line-height:1.6; color:var(--text-soft); max-width:560px;}
	.hero-cats{display:flex; gap:12px; flex-wrap:wrap; margin-top:36px;}
	.hero-cats a{
		font-size:13px; font-weight:600; padding:9px 16px; border-radius:100px;
		background:rgba(255,255,255,0.6); border:1px solid var(--line); color:var(--green-deep);
		transition:transform 0.3s var(--ease), background 0.3s var(--ease);
	}
	.hero-cats a:hover{transform:translateY(-2px); background:rgba(255,255,255,0.95);}

	/* ---------- catalogue ---------- */
	.catalogue{padding:20px 0 140px;}
	.cat-block{margin-bottom:96px;}
	.cat-head{display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin-bottom:34px; flex-wrap:wrap;}
	.cat-head h2{font-size:clamp(28px,3.2vw,40px);}
	.cat-count{font-size:13px; color:var(--text-soft); font-weight:600;}

	.resource-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}
	.resource-card{
		background:var(--bg-raised); border:1px solid var(--line); border-radius:var(--radius-lg);
		overflow:hidden; box-shadow:0 2px 16px -10px rgba(45,48,44,0.08);
		transition:transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
		display:flex; flex-direction:column;
	}
	.resource-card:hover{box-shadow:var(--shadow-card);}
	.resource-thumb{position:relative; overflow:hidden; aspect-ratio:4/3; background:var(--sage-soft);}
	.resource-thumb img{width:100%; height:100%; object-fit:cover; transition:transform 0.6s var(--ease);}
	.resource-card:hover .resource-thumb img{transform:scale(1.05);}
	.resource-thumb .fallback-mark{
		position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
		background:linear-gradient(150deg, #EFEDE6 0%, var(--sage-soft) 100%);
	}
	.resource-thumb .fallback-mark span{
		width:52px; height:52px; border-radius:14px;
		background:linear-gradient(135deg, var(--green) 0%, var(--sage-deep) 100%);
		position:relative;
	}
	.resource-thumb .fallback-mark span::after{content:''; position:absolute; inset:14px; border-radius:5px; background:var(--bg); opacity:0.9;}
	.resource-body{padding:22px 22px 24px; display:flex; flex-direction:column; gap:6px; flex:1;}
	.resource-body h3{font-size:18px;}
	.resource-body p{font-size:13.5px; color:var(--text-soft); line-height:1.5; flex:1; margin-bottom:16px;}
	.resource-body .btn{align-self:flex-start;}

	@media (max-width:960px){ .resource-grid{grid-template-columns:repeat(2,1fr);} }
	@media (max-width:600px){ .resource-grid{grid-template-columns:1fr;} }

	/* ---------- modal ---------- */
	#modal{
		display:none; position:fixed; inset:0; z-index:1000;
		background:rgba(45,48,44,0.55); backdrop-filter:blur(6px);
		align-items:center; justify-content:center; padding:20px;
	}
	.modal-content{
		background:var(--bg-raised); padding:44px; border-radius:var(--radius-lg);
		max-width:460px; width:100%; text-align:left; box-shadow:var(--shadow-soft);
		position:relative;
		animation:modalIn 0.35s var(--ease);
	}
	@keyframes modalIn{ from{opacity:0; transform:translateY(16px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);} }
	.modal-content .kicker{display:block; margin-bottom:10px;}
	.modal-content h2{font-size:26px; margin-bottom:10px;}
	.modal-content p{font-size:14.5px; color:var(--text-soft); line-height:1.6; margin-bottom:28px;}
	.modal-actions{display:flex; align-items:center; gap:18px;}
	.modal-close{
		background:none; border:none; cursor:pointer; font-size:13.5px; color:var(--text-soft);
		font-weight:600; padding:0;
	}
	.modal-close:hover{color:var(--text);}
	.kicker{display:inline-block; font-size:12.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--green);}


	@media (max-width:780px){
		.wrap,.nav-inner,.hero-banner-inner{padding:0 20px;}
		.hero-banner{padding-top:190px;}
		.catalogue{padding:0 0 100px;}
		.cat-block{margin-bottom:64px;}
	}
</style>
</head>
<body>

<div class="journey-thread">
	<div class="journey-track" id="journeyTrack">
		<div class="journey-dot" id="journeyDot"></div>
	</div>
</div>

<div id="site-header"></div>

<section class="hero-banner">
	<div class="blob blob-1"></div>
	<div class="blob blob-2"></div>
	<div class="hero-banner-inner">
		<div class="reveal in">
			<div class="eyebrow"><span class="dot"></span> Planners · Business tools · TOTS-OS</div>
			<h1>Everything we offer, in one place.</h1>
			<p>Planners, branding kits, business systems and TOTS-OS plans — ready to buy and start using today.</p>
			<div class="hero-cats" id="heroCats"></div>
		</div>
	</div>
</section>

<section class="catalogue">
	<div class="wrap" id="product-container"></div>
</section>

<div id="modal">
	<div class="modal-content">
		<span class="kicker" id="modal-cat"></span>
		<h2 id="modal-title"></h2>
		<p id="modal-desc"></p>
		<div class="modal-actions">
			<a id="modal-buy" class="btn btn-primary" href="#" target="_blank" rel="noopener">Buy / Download</a>
			<button class="modal-close" onclick="document.getElementById('modal').style.display='none'">Close</button>
		</div>
	</div>
</div>

<div id="site-footer"></div>

<script>
	// ---------- same product data + Stripe links as the resources page ----------
	const products = [
		{ cat: 'Planners', title: 'Annual Planner', desc: 'Plan your year with clarity.', url: 'https://buy.stripe.com/7sYfZafZf9t34mmeQg83C0A', img: 'annualplanner.jpg' },
		{ cat: 'Planners', title: 'Weekly Planner', desc: 'Stay organised.', url: 'https://buy.stripe.com/14AbIU7sJ9t3cSS8rS83C07', img: 'weeklyplanner.jpg' },
		{ cat: 'Planners', title: 'Yearly Goals Planner', desc: 'Goal setting.', url: '#', img: 'yearly.png' },
		{ cat: 'Business', title: 'Branding Complete Suite', desc: 'Build your brand.', url: 'https://buy.stripe.com/3cI6oA28p5cN7yy5fG83C0C', img: 'branding.png' },
		{ cat: 'Business', title: '2-Day Business Audit', desc: 'System audit.', url: 'https://buy.stripe.com/14A6oAfZf8oZcSSaA083C0B', img: 'audit.png' },
		{ cat: 'Business', title: 'Brand Kickstart', desc: 'Foundations.', url: 'https://buy.stripe.com/8x2eV67sJ7kV8CCeQg83C0z', img: 'Brandstarter.png' },
		{ cat: 'Business', title: 'Business Sales Roadmap', desc: 'Sales process.', url: 'https://buy.stripe.com/bJedR228p6gRbOO4b', img: 'businesssales.jpg' },
		{ cat: 'Business', title: 'Starter Website', desc: 'Template.', url: 'https://buy.stripe.com/cNi3coaEV6gR2ee37y83C0b', img: 'starterwebsite.jpg' },
		{ cat: 'Business', title: 'Customer Management Checklist', desc: 'Client workflow.', url: '#', img: 'checklist.png' },
		{ cat: 'Business', title: 'Productivity & Focus Checklist', desc: 'Focus tools.', url: 'https://buy.stripe.com/eVq5kwdR7cFfaKK37y83C0a', img: 'focus.jpg' },
		{ cat: 'Business', title: 'Premium Brand & Social Kit', desc: 'Online presence.', url: 'https://buy.stripe.com/8x25kwdR70Wxg54bE483C09', img: 'brandsocial.png' },
		{ cat: 'TOTS OS', title: 'TOTS OS', desc: 'Operating system.', url: '#', img: 'standard.png' },
		{ cat: 'TOTS OS', title: 'TOTS OS Elite', desc: 'Operating system.', url: '#', img: 'elite.png' },
		{ cat: 'TOTS OS', title: 'TOTS OS Premium', desc: 'Management tools.', url: '#', img: 'premium.png' },
		{ cat: 'TOTS OS', title: 'TOTS OS Team Member', desc: 'Collaboration.', url: '#', img: 'tots-team.jpg' },
		{ cat: 'Other', title: 'Workout Tracker', desc: 'Physical goals.', url: 'https://buy.stripe.com/6oU14gfZfax7cSS9vW83C08', img: 'workouttracker.jpg' },
	];

	const categories = ['Planners', 'Business', 'TOTS OS', 'Other'];
	const container = document.getElementById('product-container');
	const heroCats = document.getElementById('heroCats');

	categories.forEach(cat => {
		const count = products.filter(p => p.cat === cat).length;
		heroCats.innerHTML += `<a href="#cat-${cat.replace(/\s+/g,'-')}">${cat} (${count})</a>`;

		const block = document.createElement('div');
		block.className = 'cat-block';
		block.id = `cat-${cat.replace(/\s+/g,'-')}`;
		block.innerHTML = `
			<div class="cat-head reveal">
				<h2>${cat}</h2>
				<span class="cat-count">${count} item${count === 1 ? '' : 's'}</span>
			</div>
			<div class="resource-grid" id="grid-${cat.replace(/\s+/g,'-')}"></div>
		`;
		container.appendChild(block);

		const grid = block.querySelector('.resource-grid');
		products.filter(p => p.cat === cat).forEach((p, i) => {
			const card = document.createElement('div');
			card.className = `resource-card reveal reveal-delay-${(i % 4) + 1}`;
			card.innerHTML = `
				<div class="resource-thumb">
					<img src="${p.img}" alt="${p.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
					<div class="fallback-mark" style="display:none;"><span></span></div>
				</div>
				<div class="resource-body">
					<h3>${p.title}</h3>
					<p>${p.desc}</p>
					<button class="btn btn-ghost btn-sm" type="button">View details</button>
				</div>
			`;
			card.querySelector('button').addEventListener('click', () => openM(cat, p.title, p.desc, p.url));
			grid.appendChild(card);
		});
	});

	function openM(cat, t, d, u){
		document.getElementById('modal-cat').innerText = cat;
		document.getElementById('modal-title').innerText = t;
		document.getElementById('modal-desc').innerText = d;
		document.getElementById('modal-buy').href = u;
		document.getElementById('modal').style.display = 'flex';
	}
	document.getElementById('modal').addEventListener('click', (e) => {
		if(e.target.id === 'modal'){ e.currentTarget.style.display = 'none'; }
	});

	// reveal on scroll (run after cards are built)
	const revealEls = document.querySelectorAll('.reveal:not(.in)');
	const io = new IntersectionObserver((entries) => {
		entries.forEach(entry => {
			if(entry.isIntersecting){
				entry.target.classList.add('in');
				io.unobserve(entry.target);
			}
		});
	}, { threshold:0.12 });
	revealEls.forEach(el => io.observe(el));
</script>
<script src="header.js"></script>

</body>
</html>
