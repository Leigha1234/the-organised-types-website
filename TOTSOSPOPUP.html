<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TOTS-OS Popup Preview</title>
<meta name="description" content="Preview the cinematic TOTS-OS launch popup experience." />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0b0b;
    --card: rgba(16, 16, 16, 0.98);
    --line: rgba(255, 255, 255, 0.12);
    --text: rgba(255, 255, 255, 0.92);
    --muted: rgba(255, 255, 255, 0.62);
    --sage: #A9B897;
    --radius: 30px;
    --ease: cubic-bezier(.22, 1, .36, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 10% 10%, rgba(169,184,151,0.18), transparent 38%),
                radial-gradient(circle at 85% 20%, rgba(255,255,255,0.06), transparent 35%),
                #050505;
    display: grid;
    place-items: center;
    overflow: hidden;
}

.preview-note {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.tots-popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999999;
    padding: 20px;
    animation: popupFade 0.8s ease;
}

@keyframes popupFade {
    from { opacity: 0; }
    to { opacity: 1; }
}

.tots-popup {
    position: relative;
    width: 100%;
    max-width: 860px;
    background: linear-gradient(145deg, rgba(22,22,22,0.98), rgba(6,6,6,0.98));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 34px;
    overflow: hidden;
    padding: 60px 50px;
    box-shadow: 0 40px 120px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
    animation: popupEnter 1s var(--ease);
}

@keyframes popupEnter {
    from { transform: translateY(40px) scale(0.96); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
}

.tots-close {
    position: absolute;
    top: 18px;
    right: 22px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 2.5rem;
    line-height: 1;
    cursor: pointer;
    transition: 0.3s ease;
    z-index: 10;
}

.tots-close:hover {
    color: white;
    transform: rotate(90deg);
}

.mini-laptop-wrapper {
    position: relative;
    width: 100%;
    max-width: 470px;
    margin: 0 auto 54px;
    perspective: 1800px;
}

.mini-screen {
    position: relative;
    height: 250px;
    border-radius: 24px 24px 10px 10px;
    background: linear-gradient(180deg, #1e1e1e, #040404);
    border: 1px solid rgba(255,255,255,0.08);
    transform-origin: bottom center;
    transform: rotateX(-100deg);
    animation: laptopOpen 2.2s var(--ease) forwards;
    animation-delay: 0.5s;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(255,255,255,0.08);
}

@keyframes laptopOpen {
    0% { transform: rotateX(-100deg); }
    100% { transform: rotateX(0deg); }
}

.mini-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.65;
}

.screen-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 70%);
}

.screen-content {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
}

.boot-line {
    width: 0;
    height: 1px;
    background: rgba(255,255,255,0.35);
    margin-bottom: 24px;
    animation: bootLine 1.5s ease forwards;
    animation-delay: 1.5s;
}

@keyframes bootLine {
    to { width: 200px; }
}

.screen-content h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.8rem;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.05em;
    background: linear-gradient(90deg, white, rgba(255,255,255,0.6));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1.2s ease forwards;
    animation-delay: 1.8s;
}

.screen-content p {
    margin-top: 14px;
    font-size: 0.76rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 1.2s ease forwards;
    animation-delay: 2.2s;
}

.screen-content span {
    margin-top: 20px;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.22);
    opacity: 0;
    animation: fadeUp 1.2s ease forwards;
    animation-delay: 2.6s;
}

@keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
}

.mini-base {
    width: 560px;
    max-width: 125%;
    height: 22px;
    margin-left: 50%;
    transform: translateX(-50%);
    border-radius: 0 0 60px 60px;
    background: linear-gradient(180deg, #6b6b6b, #1d1d1d);
    border: 1px solid rgba(255,255,255,0.05);
    position: relative;
    z-index: 1;
}

.mini-base::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 5px;
    transform: translateX(-50%);
    width: 130px;
    height: 6px;
    border-radius: 999px;
    background: rgba(0,0,0,0.45);
}

.mini-shadow {
    width: 280px;
    height: 60px;
    margin: -8px auto 0;
    background: rgba(169,184,151,0.2);
    filter: blur(45px);
    border-radius: 50%;
}

.tots-popup-content {
    text-align: center;
}

.popup-small-text {
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 18px;
}

.tots-popup-content h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.3rem;
    line-height: 1.2;
    margin-bottom: 22px;
    font-weight: 700;
}

.popup-description {
    max-width: 620px;
    margin: 0 auto;
    line-height: 1.72;
    color: rgba(255,255,255,0.62);
}

.popup-buttons {
    margin-top: 32px;
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
}

.popup-primary-btn,
.popup-secondary-btn {
    border-radius: 999px;
    padding: 14px 26px;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), background 0.35s var(--ease);
}

.popup-primary-btn {
    background: white;
    color: black;
}

.popup-primary-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(255,255,255,0.12);
}

.popup-secondary-btn {
    background: transparent;
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.7);
}

.popup-secondary-btn:hover {
    background: rgba(255,255,255,0.08);
}

@media (max-width: 768px) {
    .tots-popup { padding: 34px 20px; border-radius: 24px; }
    .mini-screen { height: 190px; }
    .screen-content h2 { font-size: 2rem; }
    .tots-popup-content h3 { font-size: 1.7rem; }
    .popup-buttons { flex-direction: column; }
    .popup-primary-btn, .popup-secondary-btn { width: 100%; }
}
</style>
<link rel="stylesheet" href="cinematic-interface.css" />
</head>
<body>
<div id="site-header"></div>

<script>
fetch('header.html')
    .then(function(response){ return response.text(); })
    .then(function(data){ document.getElementById('site-header').innerHTML = data; })
    .catch(function(err){ console.error('Header load error:', err); });
</script>

<div class="preview-note">Popup Preview</div>

<div id="totsPopupOverlay" class="tots-popup-overlay">
    <div class="tots-popup" role="dialog" aria-labelledby="popupTitle" aria-modal="true">
        <button class="tots-close" onclick="closeTotsPopup()" aria-label="Close popup">&times;</button>

        <div class="mini-laptop-wrapper">
            <div class="mini-screen">
                <img src="totsdevices.png" alt="TOTS-OS dashboard preview" />
                <div class="screen-glow"></div>
                <div class="screen-content">
                    <div class="boot-line"></div>
                    <h2>TOTS OS</h2>
                    <p>Coming Soon</p>
                    <span>System v1.0</span>
                </div>
            </div>
            <div class="mini-base"></div>
            <div class="mini-shadow"></div>
        </div>

        <div class="tots-popup-content">
            <p class="popup-small-text">Official Protocol</p>
            <h3 id="popupTitle">The Future of<br>Organization.</h3>
            <p class="popup-description">
                TOTS OS is a high-fidelity business dashboard and CRM designed for ambitious teams
                who want premium design and operational clarity in one calm system.
            </p>

            <div class="popup-buttons">
                <a href="TOTS-OS.html" class="popup-primary-btn" onclick="closeTotsPopup()">Explore TOTS-OS</a>
                <a href="contact.html" class="popup-secondary-btn" onclick="closeTotsPopup()">Book Early Access Call</a>
            </div>
        </div>
    </div>
</div>

<script>
function closeTotsPopup() {
    const overlay = document.getElementById('totsPopupOverlay');
    overlay.style.opacity = '0';
    setTimeout(function() {
        overlay.style.display = 'none';
    }, 500);
}

window.addEventListener('click', function(event) {
    const overlay = document.getElementById('totsPopupOverlay');
    if (event.target === overlay) {
        closeTotsPopup();
    }
});
</script>
<div id="site-footer"></div>
<script>
fetch('footer.html')
    .then(function(response){ return response.text(); })
    .then(function(data){
        document.getElementById('site-footer').innerHTML = data;
        var banner = document.getElementById('cookie-banner');
        var accept = document.getElementById('accept-cookies');
        if (banner && !localStorage.getItem('cookiesAccepted')) { banner.style.display = 'block'; }
        if (accept && banner) {
            accept.addEventListener('click', function(){
                localStorage.setItem('cookiesAccepted', 'true');
                banner.style.display = 'none';
            });
        }
    })
    .catch(function(err){ console.error('Footer load error:', err); });
</script>
<script defer src="cinematic-interface.js"></script>
</body>
</html>
